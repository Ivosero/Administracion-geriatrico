services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: serena
      POSTGRES_USER: serena
      POSTGRES_PASSWORD: serena
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serena"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgres://serena:serena@db:5432/serena
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
